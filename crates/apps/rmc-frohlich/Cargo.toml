[package]
name = "rmc-frohlich"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
env_logger.workspace = true
log.workspace = true
rmc-core = { workspace = true, features = ["serde"] }
rmc-grids.workspace = true
rmc-numeric.workspace = true
rmc-io.workspace = true
nalgebra = { workspace = true, features = ["serde-serialize"] }
rand.workspace = true
rustfft.workspace = true
num-complex.workspace = true
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
indicatif.workspace = true
cubecl = { version = "=0.10.0", default-features = false, features = ["std", "stdlib"], optional = true }

[dev-dependencies]
proptest.workspace = true

[features]
default = []
gpu = ["dep:cubecl"]
gpu-cpu = ["gpu", "cubecl/cpu"]
gpu-hip = ["gpu", "cubecl/hip"]
gpu-cuda = ["gpu", "cubecl/cuda"]
