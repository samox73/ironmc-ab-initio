[package]
name = "rmc-ab-initio"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
publish = false

# Standalone root: never let cargo attach this package to a workspace above it.
[workspace]

[dependencies]
bincode = "1"
env_logger = "0.11"
indicatif = "0.17"
log = "0.4"
num-complex = { version = "0.4", features = ["serde"] }
nalgebra = { version = "0.33", default-features = false, features = ["std", "serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1"
slotmap = { version = "1", features = ["serde"] }
tabled = "0.21.0"
cubecl = { version = "=0.10.0", default-features = false, features = ["std", "stdlib"], optional = true }
# The IronMC framework, from a sibling checkout (../ironmc). build.rs records
# that checkout's commit next to this repo's, so binaries stay traceable.
rmc-core = { path = "../ironmc/crates/rmc-core", features = ["serde"] }
rmc-diagmc = { path = "../ironmc/crates/rmc-diagmc" }
rmc-frohlich = { path = "../ironmc/crates/apps/rmc-frohlich" }

[features]
default = []
gpu = ["dep:cubecl"]
gpu-cpu = ["gpu", "cubecl/cpu"]
gpu-hip = ["gpu", "cubecl/hip"]
gpu-cuda = ["gpu", "cubecl/cuda"]
